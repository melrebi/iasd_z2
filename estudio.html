<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio - Apps</title>
    <style>
        /* Reseteo y variables para un diseño limpio y blanco */
        :root {
            --bg-color: #ffffff;
            --text-main: #222222;
            --text-muted: #666666;
            --border-color: #eaeaea;
            --hover-bg: #f9f9f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 800px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navegación limpia */
        .navbar {
            padding: 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(255, 255, 255, 0.95);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            font-size: 28px;
            margin-right: 15px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .back-btn:hover, .back-btn:active {
            background-color: var(--hover-bg);
        }

        .navbar h1 {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Contenedor Principal */
        .content {
            padding: 40px 20px;
            text-align: center;
        }

        .instructions {
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 0.95rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Cuadrícula de Aplicaciones */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 30px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Estilo de cada App */
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 15px 10px;
            border-radius: 12px;
            transition: transform 0.2s, background-color 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .app-item:hover {
            background-color: var(--hover-bg);
        }

        .app-item:active {
            transform: scale(0.95);
        }

        .app-icon {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .app-title {
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="back-btn" aria-label="Volver al inicio">‹</a>
        <h1>ESTUDIO</h1>
    </nav>

    <main class="content">
        <p class="instructions">Selecciona una aplicación. Se abrirá directamente si la tienes instalada, o te llevará a la tienda para descargarla.</p>

        <div class="app-grid">
            <!-- EGW Writings -->
            <div class="app-item" onclick="openApp('com.whiteestate.egwwritings', 'egw://', 'id-ios-placeholder')">
                <img src="ellen_white.jpeg" alt="EGW Writings" class="app-icon">
                <span class="app-title">EGW Writings</span>
            </div>

            <!-- Reavivados por su Palabra (RPSP) -->
            <div class="app-item" onclick="openApp('com.edgarjp.rpsp', 'rpsp://', 'id-ios-placeholder')">
                <img src="matutina.jpeg" alt="Reavivados por su Palabra" class="app-icon">
                <span class="app-title">Reavivados</span>
            </div>

            <!-- Escuela Sabática -->
            <div class="app-item" onclick="openApp('com.cryart.sabbathschool', 'sabbathschool://', 'id-ios-placeholder')">
                <img src="ES.jpeg" alt="Escuela Sabática" class="app-icon">
                <span class="app-title">Escuela Sabática</span>
            </div>
        </div>
    </main>

    <script>
        /**
         * Función mejorada para manejar el Deep Linking.
         * Utiliza Intents nativos en Android para forzar la apertura de la app.
         */
        function openApp(androidPackage, iosScheme, iosAppId) {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isAndroid = /android/i.test(userAgent);
            const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

            const playStoreUrl = 'https://play.google.com/store/apps/details?id=' + androidPackage;
            
            if (isAndroid) {
                // Generar URL de Intent de Android (Lanza la app, o hace fallback a la Play Store)
                // action=android.intent.action.MAIN simula un toque en el ícono de la pantalla de inicio
                const intentUrl = `intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=${androidPackage};S.browser_fallback_url=${encodeURIComponent(playStoreUrl)};end;`;
                
                // Ejecutamos el intent nativo
                window.location.href = intentUrl;
                return;
            }

            if (isIOS) {
                // Lógica temporal para iOS hasta que tengamos los enlaces de la App Store
                window.location.href = iosScheme; // Intenta abrir si tiene esquema
                setTimeout(() => {
                    alert("Enlace a la App Store de iOS próximamente.");
                }, 1500);
                return;
            }

            // Si es una PC/Mac, abrir directamente la página de Google Play en una pestaña nueva
            window.open(playStoreUrl, '_blank');
        }
    </script>
</body>
</html>
