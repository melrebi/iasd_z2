<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio - Apps</title>
    <style>
        /* Reseteo y variables para un diseño limpio y blanco */
        :root {
            --bg-color: #ffffff; /* Fondo completamente blanco */
            --text-main: #222222;
            --text-muted: #666666;
            --border-color: #eaeaea;
            --hover-bg: #f9f9f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; /* Quita el resalte azul en móviles */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 800px; /* Un poco más ancho para la cuadrícula en PC */
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navegación limpia */
        .navbar {
            padding: 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(255, 255, 255, 0.95);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            font-size: 28px;
            margin-right: 15px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .back-btn:hover, .back-btn:active {
            background-color: var(--hover-bg);
        }

        .navbar h1 {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Contenedor Principal */
        .content {
            padding: 40px 20px;
            text-align: center;
        }

        .instructions {
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 0.95rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Cuadrícula de Aplicaciones (Estilo minimalista) */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 30px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Estilo de cada App (Botón) */
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 15px 10px;
            border-radius: 12px;
            transition: transform 0.2s, background-color 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .app-item:hover {
            background-color: var(--hover-bg);
        }

        .app-item:active {
            transform: scale(0.95);
        }

        .app-icon {
            width: 65px;
            height: 65px;
            object-fit: contain;
            margin-bottom: 15px;
            /* Si las imágenes adjuntas son PNG transparentes, no necesitan fondo */
        }

        .app-title {
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            line-height: 1.2;
        }

    </style>
</head>
<body>

    <!-- Navegación -->
    <nav class="navbar">
        <a href="index.html" class="back-btn" aria-label="Volver al inicio">‹</a>
        <h1>ESTUDIO</h1>
    </nav>

    <!-- Contenido -->
    <main class="content">
        <p class="instructions">Selecciona una aplicación. Se abrirá directamente si la tienes instalada, o te llevará a la tienda para descargarla.</p>

        <!-- Cuadrícula de Apps -->
        <div class="app-grid">

            <!-- EGW Writings -->
            <!-- Aquí debes reemplazar 'imagen1.png' por el nombre real o la ruta de la primera imagen adjunta -->
            <div class="app-item" onclick="openApp('egw://', 'com.whiteestate.egwwritings', 'id-ios-placeholder')">
                <img src="imagen1.png" alt="EGW Writings" class="app-icon">
                <span class="app-title">EGW Writings</span>
            </div>

            <!-- Reavivados por su Palabra (RPSP) -->
             <!-- Aquí debes reemplazar 'imagen2.png' por el nombre real o la ruta de la segunda imagen adjunta -->
            <div class="app-item" onclick="openApp('rpsp://', 'com.edgarjp.rpsp', 'id-ios-placeholder')">
                <img src="imagen2.png" alt="Reavivados por su Palabra" class="app-icon">
                <span class="app-title">Reavivados</span>
            </div>

            <!-- Escuela Sabática -->
             <!-- Aquí debes reemplazar 'imagen3.png' por el nombre real o la ruta de la tercera imagen adjunta -->
            <div class="app-item" onclick="openApp('sabbathschool://', 'com.cryart.sabbathschool', 'id-ios-placeholder')">
                <img src="imagen3.png" alt="Escuela Sabática" class="app-icon">
                <span class="app-title">Escuela Sabática</span>
            </div>

        </div>
    </main>

    <!-- Script de Deep Linking -->
    <script>
        /**
         * Función para manejar el Deep Linking (Abrir app o ir a la tienda)
         * @param {string} appScheme - El esquema URL de la app (ej: 'egw://')
         * @param {string} androidPackage - El ID del paquete en Google Play
         * @param {string} iosAppId - El ID de la app en la App Store (placeholder)
         */
        function openApp(appScheme, androidPackage, iosAppId) {
            
            // 1. Detectar el sistema operativo
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            let isAndroid = /android/i.test(userAgent);
            let isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

            // Definir las URLs de las tiendas
            const playStoreUrl = 'https://play.google.com/store/apps/details?id=' + androidPackage;
            const appStoreUrl = 'https://apps.apple.com/app/id' + iosAppId; // Placeholder

            // Si es un navegador de escritorio, enviar a Google Play por defecto
            if (!isAndroid && !isIOS) {
                window.open(playStoreUrl, '_blank');
                return;
            }

            // 2. Intentar abrir el esquema de la App (Deep Link)
            // Nota: Para que esto funcione perfecto, las apps deben tener configurado su URI Scheme.
            // He puesto 'egw://', 'rpsp://', 'sabbathschool://' como ejemplos estándar.
            let appUrl = appScheme; 

            // Registrar el tiempo actual
            const start = Date.now();
            let timer;

            // Función de fallback a la tienda
            const fallbackToStore = () => {
                const end = Date.now();
                // Si pasaron menos de 2000ms, asumimos que la app no se abrió y lanzamos la tienda
                if (end - start < 2000) {
                    if (isAndroid) {
                        window.location.href = playStoreUrl;
                    } else if (isIOS) {
                        // Descomentar esto cuando tengas los IDs de iOS reales
                        // window.location.href = appStoreUrl; 
                        alert("Enlace a iOS próximamente.");
                    }
                }
            };

            // Intentar abrir la app
            window.location.href = appUrl;

            // Configurar el temporizador para el fallback (1.5 segundos)
            timer = setTimeout(fallbackToStore, 1500);

            // Manejar si la página se oculta (significa que la app se abrió con éxito)
            window.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    clearTimeout(timer);
                }
            });
        }
    </script>
</body>
</html>
